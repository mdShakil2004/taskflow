services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_dev_password
      POSTGRES_DB: taskflow
    ports:
      # Bound to loopback only — reachable from CLI tools (psql, prisma)
      # running in the same dev environment, but never a candidate for
      # Codespaces' automatic external port forwarding. Only `api`/`3000`
      # and the frontend's `5173` are meant to be reachable from a browser;
      # see docs/codespaces.md.
      - "127.0.0.1:5432:5432"
    volumes:
      - taskflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Loopback-only, same rationale as postgres above.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://taskflow:taskflow_dev_password@postgres:5432/taskflow?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      # Bound to all interfaces so GitHub Codespaces (or any cloud dev
      # environment) can detect and forward this port to the browser.
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://taskflow:taskflow_dev_password@postgres:5432/taskflow?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  taskflow_postgres_data:
